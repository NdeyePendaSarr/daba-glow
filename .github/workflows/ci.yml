name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vulnérabilités des dépendances livrées au navigateur (hors outils de développement)
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Tests unitaires et de rendu, avec seuils de couverture (vitest.config.ts)
      - name: Tests et couverture
        run: npm run test:couverture

      - name: Build
        run: npm run build

  # Navigateur réel : premier écran mobile, accessibilité (axe) et politique de sécurité (CSP)
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      # playwright.config.ts construit puis démarre le site sur le port 3100
      - name: Tests de bout en bout
        run: npm run test:e2e
